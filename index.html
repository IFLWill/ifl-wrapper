<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IFL Launcher</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="https://cdn.shopify.com/s/files/1/1243/6738/files/manifest.json?v=1751865738">

  <!-- Icons & Theme -->
  <link rel="icon" href="https://cdn.shopify.com/s/files/1/1243/6738/files/favicon_192_192.png?v=1751869518" type="image/png">
  <link rel="apple-touch-icon" href="https://cdn.shopify.com/s/files/1/1243/6738/files/favicon_180_180.png?v=1751869535">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IFL Launcher">
  <meta name="theme-color" content="#f4d365">

  <!-- Fallback Styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f4f4f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #000;
      text-align: center;
      gap: 20px;
    }
    button {
      padding: 18px 32px;
      font-size: 20px;
      background: #f4d365;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 80%;
      max-width: 300px;
    }
    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <button id="customOrdersBtn">Open IFL Custom Orders</button>
  <button id="reelRepairsBtn">Open IFL Reel Repair Form</button>

  <script>
    // Open Custom Orders
    document.getElementById('customOrdersBtn').addEventListener('click', () => {
      window.open(
        'https://script.google.com/a/macros/isofishinglifestyle.com.au/s/AKfycbx6Vt0fr92dEDtJkoc0szeePjIkVnyk4Qv6WSpzvjMQ/dev',
        '_blank', 'noopener'
      );
    });

    // Open Reel Repair Form
    document.getElementById('reelRepairsBtn').addEventListener('click', () => {
      window.open(
        'https://script.google.com/macros/s/AKfycbxb61KYRjYZnbh0aLH9O1oGhlxj3NYqqfGxa9P9zFFo57esH73KZzY5bVnX3foflJJG/exec',
        '_blank', 'noopener'
      );
    });
  </script>
</body>
</html>
